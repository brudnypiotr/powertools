<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>powertools</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>powertools</h1>
  <nav>
    <button data-tab="dictation" class="active">Dictation</button>
    <button data-tab="meetings" disabled title="next">Meetings</button>
    <button data-tab="teams">Teams</button>
    <button data-tab="mail">Mail</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="diagnostics">Diagnostics</button>
  </nav>
</header>

<main>
  <section id="dictation" class="tab active">
    <div class="card status">
      <span id="pill" class="pill">loading</span>
      <span id="hint"></span>
      <span class="meter"><span id="level"></span></span>
      <button id="toggle">Start dictation</button>
    </div>
    <div id="last" class="card hidden"></div>
    <div class="row">
      <h2>History</h2>
      <input id="search" type="search" placeholder="Search">
    </div>
    <ul id="history"></ul>
  </section>

  <section id="teams" class="tab">
    <div class="card graphbar"></div>
    <div class="row">
      <input id="chat-filter" type="search" placeholder="Filter by name or title">
      <select id="chat-type">
        <option value="">All chats</option><option value="oneOnOne">1:1</option>
        <option value="group">Group</option><option value="meeting">Meeting</option>
      </select>
      <button id="chat-refresh">Refresh</button>
    </div>
    <div class="card list-card"><table class="list"><thead><tr>
      <th><input type="checkbox" id="chat-all"></th><th>Chat</th><th>Type</th><th>Last activity</th><th>Exported up to</th>
    </tr></thead><tbody id="chats"><tr><td colspan="5">Paste a token above, then Refresh.</td></tr></tbody></table></div>
    <div class="row exportbar"><span class="range" data-for="teams"></span>
      <button id="chat-export" class="primary">Export selected</button></div>
    <div class="jobs"></div>
  </section>

  <section id="mail" class="tab">
    <div class="card graphbar"></div>
    <form id="mail-search" class="card searchform">
      <label>Folder <select name="folder"><option value="">All mail</option></select></label>
      <label>Person <input name="person" placeholder="name or address"></label>
      <label>Subject <input name="subject" placeholder="words in the subject"></label>
      <span class="range" data-for="mail-search"></span>
      <button class="primary">Search</button>
    </form>
    <div class="card list-card"><table class="list"><thead><tr>
      <th><input type="checkbox" id="mail-all"></th><th>Subject</th><th>People</th><th>Msgs</th><th>Last</th><th>Exported up to</th>
    </tr></thead><tbody id="threads"><tr><td colspan="6">Search to list threads.</td></tr></tbody></table></div>
    <div class="row exportbar"><span class="range" data-for="mail"></span>
      <button id="mail-export" class="primary">Export selected</button></div>
    <div class="jobs"></div>
  </section>

  <section id="settings" class="tab">
    <form id="settings-form" class="card form">
      <label>Hotkey <input name="hotkey" placeholder="alt+q"><small>e.g. alt+q, ctrl+shift+space, f9</small></label>
      <label>Model
        <select name="model">
          <option value="turbo">turbo (fast, recommended)</option>
          <option value="large-v3">large-v3 (most accurate, slower)</option>
          <option value="medium">medium</option>
          <option value="small">small</option>
        </select>
      </label>
      <label>Language
        <select name="language">
          <option value="">Detect (Polish + English mix)</option>
          <option value="pl">Polish</option>
          <option value="en">English</option>
        </select>
      </label>
      <label>Microphone <select name="input_device"></select></label>
      <label class="check"><input type="checkbox" name="paste"> Paste into the active window (off: only copy)</label>
      <label class="check"><input type="checkbox" name="restore_clipboard"> Restore the previous clipboard after pasting</label>
      <label class="check"><input type="checkbox" name="open_window_on_start"> Open this window when the app starts</label>
      <label>Export folder <input name="output_dir" placeholder="Documents\powertools">
        <small>Where Teams and mail exports go. Point it at the wiki inbox.</small></label>
      <label class="check"><input type="checkbox" name="mail_attachments"> Save mail attachments next to the thread</label>
      <label>Beam size <input name="beam_size" type="number" min="1" max="10"><small>5 = default; 1 = fastest</small></label>
      <label>Vocabulary <textarea name="vocabulary" rows="6" placeholder="one word or name per line"></textarea>
        <small>Whisper is nudged to spell these words this way.</small></label>
      <label>Replacements <textarea name="replacements" rows="6" placeholder="merlo => Merlot"></textarea>
        <small>One rule per line: <code>heard => wanted</code>. Whole words, case-insensitive.</small></label>
      <div class="row"><button type="submit">Save</button><span id="saved"></span></div>
    </form>
  </section>

  <section id="diagnostics" class="tab">
    <div class="card"><pre id="diag"></pre></div>
    <div class="row"><h2>Log</h2><button id="quit" class="danger">Quit powertools</button></div>
    <div class="card"><pre id="log"></pre></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
